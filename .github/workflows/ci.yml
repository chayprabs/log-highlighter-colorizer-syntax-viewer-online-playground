name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: License check
        run: npx license-checker --production --failOn GPL,AGPL,LGPL

      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright E2E (PRD §17–18, dev server)
        run: npm run test:e2e

      - name: Next.js production build
        run: npm run build

      - name: Clean build artifacts before static export
        run: rm -rf .next out

      - name: Static export smoke (PRD §16 Cloudflare path)
        run: npm run build:static
